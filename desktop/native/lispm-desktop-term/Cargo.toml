[package]
name = "lispm-desktop-term"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Terminals for lispm-desktop: emulated off Emacs's thread, drawn only when shown"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The event loop's PTY keys in src/pty.rs were read from this version.
alacritty_terminal = "=0.26.0"
libc = "0.2"
polling = "3.8"
emacs = { version = "0.23.0", features = ["emacs-28"] }

[profile.release]
opt-level = 3
lto = "thin"
