<!doctype html>
<!--
  Social preview card for RyanKung/lispm: the LispM poster, finished with
  the two details of GitHub's own Open Graph card, the GitHub mark at the
  bottom right and the language bar along the bottom edge.

  Render to the 1280x640 upload size (Settings -> General -> Social preview):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1280,640 --virtual-time-budget=10000 \
      --screenshot=/tmp/card@2x.png "file://$PWD/assets/social/github-card.html"
    magick /tmp/card@2x.png -filter Lanczos -resize 1280x640 \
      assets/social/lispm-github-social.png

  Language shares come from `gh api repos/RyanKung/lispm/languages`;
  colors are GitHub Linguist's.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: rgb(249, 243, 233); /* the poster's paper */
  }
  /* The poster is 5:2; fade its paper into the flat paper above and below. */
  #poster {
    position: absolute; left: 0; top: 30px; width: 1280px; height: 512px;
    -webkit-mask-image: linear-gradient(transparent, #000 28px, #000 484px, transparent);
            mask-image: linear-gradient(transparent, #000 28px, #000 484px, transparent);
  }
  /* Right margin matches the title's left margin; ink is the poster's. */
  #mark { position: absolute; right: 120px; bottom: 69px; width: 49px; height: 49px; opacity: 0.55; }
  #languages { position: absolute; left: 0; bottom: 0; width: 1280px; height: 26px; display: flex; }
</style>
</head>
<body>
  <img id="poster" src="lispm-x-cover-5x2-v2.png" alt="">

  <!-- Octicons (MIT), @primer/octicons 19.8.0, mark-github-16. -->
  <svg id="mark" viewBox="0 0 16 16" fill="#191816" xmlns="http://www.w3.org/2000/svg"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>

  <div id="languages"></div>

<script>
  // Bytes per language from the GitHub API; colors from Linguist.
  const LANGUAGES = [
    ["Emacs Lisp", 514170, "#c065db"],
    ["Python", 10712, "#3572a5"],
    ["HTML", 2125, "#e34c26"],
    ["Makefile", 997, "#427819"],
  ];

  const bar = document.getElementById("languages");
  for (const [name, bytes, color] of LANGUAGES) {
    const segment = document.createElement("div");
    segment.title = name;
    segment.style.flex = `${bytes} 0 0`;
    segment.style.background = color;
    bar.appendChild(segment);
  }
</script>
</body>
</html>
