name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    # The development snapshot may break for reasons of its own.
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        # 30.1 is the oldest LispM supports (Package-Requires).
        emacs: ['30.1', '30.2', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@v7
      # LispM Kit, whose engine translates LispM's words, from its own
      # repository; outside .deps/, which the cache keeps.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kit
          path: .lispm-kit
      # LispM UI, which draws LispM's forms, a library only git holds.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          path: .lispm-ui
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      # make deps installs lispm.el's Package-Requires (mcp.el) into .deps/.
      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ matrix.emacs }}-${{ hashFiles('lisp/lispm.el', 'test/install-deps.el') }}
      - name: Byte-compile, warnings as errors
        run: make compile LISPM_KIT=.lispm-kit LISPM_UI=.lispm-ui
      - name: Test
        run: make test LISPM_KIT=.lispm-kit LISPM_UI=.lispm-ui

  kernel-worker:
    name: Elisp workers through Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kit
          path: .lispm-kit
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          path: .lispm-ui
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kernel
          path: .lispm-kernel
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - name: Build Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
          make -C .lispm-kernel
      - name: Test worker isolation and cancellation
        run: make test-kernel LISPM_KERNEL=.lispm-kernel LISPM_KIT=.lispm-kit LISPM_UI=.lispm-ui

